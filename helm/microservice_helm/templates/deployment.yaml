apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.appimage }}:{{ .Values.appVersion }}"  
        ports:
        - name: {{ .Values.appName }}
          containerPort: {{ .Values.containerPort }}
        env:
        {{- range .Values.containerEnvVars }} 
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}     
        