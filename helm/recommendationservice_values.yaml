appName: recommendationservice
appimage: us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice
appVersion: v0.10.4
replicaCount: 1
containerPort: 8080
containerEnvVars:
  - name: PORT
    value: "8080"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice:3550"
  - name: DISABLE_PROFILER
    value: "1"

serviceType: ClusterIP
servicePort: 8080