appName: emailservice
appimage: us-central1-docker.pkg.dev/google-samples/microservices-demo/emailservice
appVersion: v0.10.4
replicaCount: 2
containerPort: 8080
containerEnvVars:
  - name: PORT
    value: "8080"
  - name: DISABLE_PROFILER
    value: "1"

serviceType: ClusterIP
servicePort: 5000